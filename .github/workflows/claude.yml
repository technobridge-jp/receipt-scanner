# Issue／PR のコメントで「@claude」と呼びかけると、GitHub Actions 上で Claude Code が作業する。
# 2026-11-11 導入（lead-chat で動作確認済み）。
# 運用ルール：
#   - 呼びかけられるのは、このリポジトリのオーナー・メンバー・コラボレーターだけ（下の if で制限）
#   - Claude は作業ブランチと PR までを作る。master へのマージは松井が承認してから行う
#   - 認証は CLAUDE_CODE_OAUTH_TOKEN（松井の Claude サブスクリプションのトークン）を Secrets に登録して使う
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Bash(npm ci),Bash(npm install *),Bash(npm run *),Bash(npm audit *),Bash(npx tsc *),Bash(npx npm-check-updates *),Bash(git *),Bash(gh pr *),Bash(gh issue *)"
            --append-system-prompt "日本語で報告すること。守ること：1. .env や秘密情報を読まない・表示しない・コミットしない。2. master への直接 push とマージはしない。作業はブランチを切り、PR を作るところまで。3. npm audit fix --force は使わない。4. 本番DBへの接続や prisma migrate deploy、db seed、db push は実行しない。5. 変更したら npm run lint、型チェック、npm run build を実行し、結果を PR に書く。6. 判断に迷うことや指示にない大きな変更は、作業せずにコメントで質問する。"
